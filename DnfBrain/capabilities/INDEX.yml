# Capability Index — THE ENTRY POINT for executable how-tos.
# (The KNOWLEDGE library is separate — that's under library/, catalogued by library/INDEX.md.)
#
# Reading order:  INDEX -> GLANCE -> CARD -> SKILL -> README
# Rule: never load a tier without first loading the tier above it.
# Keep `count` accurate — validate.py checks it.

count: 3

# LIBRARY OPERATIONS
library-ops:
  - id: curator
    tagline: "File new material into the right shelf, keep the ledgers in sync"
    why: "The librarian procedure — intake, classification, promotion, archiving. Use it whenever new knowledge arrives."
  - id: registrar
    tagline: "Keep the surfaced registries (cards, manifests, browse tables) in sync"
    why: "The by-name layer's keeper — character cards, appearance routes, and deciding when a category earns a registry."
  - id: project-intake
    tagline: "From 'I've got a new project' to a wired instance under library/projects/"
    why: "The kickoff procedure — interview, instantiate, wire references, register. Run it the moment a project is announced."

# Add capabilities as you grow: research, synthesis, export, publish...
# At ~30+, convert this to a prose INDEX.md (see the pattern in the base moollm template).
