card:
  name: plain-text-durability
  type: [unit, reference]
  tagline: "Why versioned plain text outlives app-specific formats"
  related: []                    # (siblings link in as the practices shelf fills)

files:
  tiers: [GLANCE.yml, CARD.yml, SKILL.md, README.md]
  resolution: card

k-lines:
