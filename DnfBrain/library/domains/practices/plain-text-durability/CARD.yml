# Declarative routing (M2). Names the SITUATION where this note is worth loading.
advertisements:
  CHOOSING-A-DURABLE-FORMAT:
    score: 70
    when: "Deciding how to store something meant to last, or defending plain text over an app format"
  EXPLAIN-WHY-THIS-LIBRARY-IS-MARKDOWN:
    score: 60
